<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>secretsky banner</title>
    <style>
      :root {
        color: #111;
        background: #fff;
        font-family: Georgia, "Times New Roman", serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #fff;
      }

      main {
        width: calc(100% - 48px);
        height: calc(100% - 48px);
        display: grid;
        place-content: center;
        justify-items: center;
        border: 2px solid #111;
      }

      h1 {
        margin: 0;
        color: #111;
        font-size: 164px;
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: -8px;
      }

      p {
        margin: 30px 0 0;
        font-size: 38px;
        line-height: 1;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>secretsky</h1>
      <p>private microblogging</p>
    </main>
  </body>
</html>
