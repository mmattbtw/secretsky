<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>secretsky wordmark</title>
    <style>
      :root {
        color: #111;
        background: #fff;
        font-family: Georgia, "Times New Roman", serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #fff;
      }

      .wordmark {
        margin: 0;
        color: #111;
        font-size: 150px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -7px;
      }
    </style>
  </head>
  <body>
    <h1 class="wordmark">secretsky</h1>
  </body>
</html>
